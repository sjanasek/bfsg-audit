name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser-Abhängigkeiten installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0 axe-core@4.11.4
          npx playwright install --with-deps chromium
      - name: Tests
        run: python3 -m unittest discover tests -v
      - name: axe-core-Tests müssen gelaufen sein
        run: python3 -m unittest tests.test_browser_scan.MitAxe -v 2>&1 | tee axe.log; ! grep -q "skipped" axe.log
