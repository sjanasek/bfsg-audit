<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kategorie – Ursachen-Testseite</title>
  <style>
    :root { --color-text: #111111; --color-muted: #a0a0a0; }
    body { font-family: sans-serif; color: var(--color-text); background: #ffffff; }
    .product-card__price { color: var(--color-muted); font-size: 14px; }
    .grid { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Kaffee</h1>
    <ul class="grid">
      <li class="product-card">
        <img class="product-card__img" src="p1.jpg" width="120" height="90">
        <h2 class="product-card__title">Kaffee Nr. 1</h2>
        <p class="product-card__price">10,90 €</p>
        <button type="button" class="wishlist"><svg width="16" height="16" aria-hidden="true"></svg></button>
      </li>
      <li class="product-card">
        <img class="product-card__img" src="p2.jpg" width="120" height="90">
        <h2 class="product-card__title">Kaffee Nr. 2</h2>
        <p class="product-card__price">11,90 €</p>
        <button type="button" class="wishlist"><svg width="16" height="16" aria-hidden="true"></svg></button>
      </li>
      <li class="product-card">
        <img class="product-card__img" src="p3.jpg" width="120" height="90">
        <h2 class="product-card__title">Kaffee Nr. 3</h2>
        <p class="product-card__price">12,90 €</p>
        <button type="button" class="wishlist"><svg width="16" height="16" aria-hidden="true"></svg></button>
      </li>
      <li class="product-card">
        <img class="product-card__img" src="p4.jpg" width="120" height="90">
        <h2 class="product-card__title">Kaffee Nr. 4</h2>
        <p class="product-card__price">13,90 €</p>
        <button type="button" class="wishlist"><svg width="16" height="16" aria-hidden="true"></svg></button>
      </li>
      <li class="product-card">
        <img class="product-card__img" src="p5.jpg" width="120" height="90">
        <h2 class="product-card__title">Kaffee Nr. 5</h2>
        <p class="product-card__price">14,90 €</p>
        <button type="button" class="wishlist"><svg width="16" height="16" aria-hidden="true"></svg></button>
      </li>
      <li class="product-card">
        <img class="product-card__img" src="p6.jpg" width="120" height="90">
        <h2 class="product-card__title">Kaffee Nr. 6</h2>
        <p class="product-card__price">15,90 €</p>
        <button type="button" class="wishlist"><svg width="16" height="16" aria-hidden="true"></svg></button>
      </li>
    </ul>
    <form class="newsletter">
      <input type="email" name="email">
      <button type="submit">Anmelden</button>
    </form>
  </main>
</body>
</html>
